ول",subtitle:"دور المال - الاختبار النهائي",icon:x(cr,{className:"w-4 h-4"}),count:10,questions:[{q:"ما هو السبب الأكثر جوهرية لعدم انتشار المقايضة في المجتمع بأكمله؟",a:"لأن من الصعب أن تجد شخصًا يملك ما تريده ويريد أيضًا ما تملكه"},{q:"ما السبب الأكبر لاحتفاظ الأوراق النقدية الحديثة (النقود الإلزامية) بقيمتها مع أنها غير قابلة للاستبدال بالذهب؟",a:'لأن ضمان الحكومة وثقة المجتمع المشتركة بأن "يمكن استخدام هذا لشراء الأشياء"'},{q:"ما اسم الظاهرة التي تستمر فيها الأسعار في الارتفاع بشكل لا يمكن التحكم فيه وتكاد تختفي فيها قيمة المال؟",a:"التضخم المفرط"},{q:'كـ"كشري بـ٢٥ جنيهًا، شاورما بـ٤٠ جنيهًا"، أي وظيفة للمال تتيح لك مقارنة قيم سلع مختلفة برقم مشترك؟',a:"وحدة الحساب"},{q:'عندما يستلم شخص مالًا ويستطيع استخدامه لمشترياته القادمة، أي أن المال "يستمر في التداول"، مما يجعل الصفقات سلسة. أي وظيفة للمال هذه؟',a:"وسيلة التبادل"},{q:"شيء كان يمكن شراؤه بمائة جنيه منذ ١٠ سنوات لا يمكن شراؤه بنفس المائة جنيه اليوم. ما الذي انخفض؟",a:"القدرة الشرائية"},{q:"أي مما يلي خاصية صحيحة للمال الإلكتروني؟",a:"نظام يخزّن معلومات المال كبيانات رقمية ويستخدمها عبر بطاقة أو هاتف"},{q:'ما السبب في أن الأصول المشفَّرة (العملة الافتراضية) يُقال إنها غير مستقرة كـ"مخزن للقيمة"؟',a:"لأنها لا يُصدرها بنك مركزي، فتقلبات الأسعار كبيرة جدًا"},{q:"ما الفرق الأكبر بين CBDC (العملة الرقمية للبنك المركزي) والأصول المشفَّرة؟",a:"CBDC يُصدرها البنك المركزي ولها نفس دعم الثقة الذي تتمتع به العملة القانونية"},{q:'أي مما يلي هو السبب الأكثر ملاءمة لاعتبار "الشمول المالي" مهمًا بشكل خاص؟',a:"لتوصيل الخدمات المالية حتى لمن لا يستطيعون الحصول على حساب بنكي، مما يتيح المشاركة في النشاط الاقتصادي"}]}];function fi(){let[e,t]=si.useState(0),n=ec[e],[r,l]=si.useState(0);return N("div",{dir:"rtl",className:"min-h-screen bg-[#0a1931] text-white selection:bg-orange-500/30 font-[Cairo]",children:[x("style",{children:`
